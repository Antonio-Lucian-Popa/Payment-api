name: Deploy to server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-payment-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd ~/apps/laradu/app/Payment-api
            git fetch --all --prune
            git reset --hard origin/main
            if [ ! -f .env ]; then
              echo "❌ Lipsește .env pe server (chei Stripe + secrete). Rulează setup-ul inițial." >&2
              exit 1
            fi
            docker compose up -d --build
            docker image prune -f
            sleep 3
            docker compose ps
