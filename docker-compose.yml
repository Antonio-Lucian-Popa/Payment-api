services:
  payment-api:
    # Construiește imaginea local din Dockerfile-ul proiectului
    build:
      context: .
      dockerfile: Dockerfile

    # Nume de container configurabil (evită coliziuni când rulezi mai multe instanțe).
    # Suprascrie cu COMPOSE_PROJECT_NAME sau schimbă aici după nevoie.
    container_name: ${CONTAINER_NAME:-payment-api}

    # Pornește containerul automat după restart de server sau crash
    restart: unless-stopped

    # Încarcă secretele și variabilele de configurare din fișierul .env
    env_file:
      - .env

    # Suprascriem explicit valorile importante pentru production
    environment:
      NODE_ENV: production
      PORT: 3000

    # Expune portul către host (configurabil prin HOST_PORT, implicit 3000).
    # Pentru integrare doar între containere (ex. în spatele unui Nginx), poți
    # înlocui `ports` cu `expose: ["3000"]`.
    ports:
      - "${HOST_PORT:-3000}:3000"

    # Rețeaua serviciului
    networks:
      - payment-net

    # Health check pe endpoint-ul intern al API-ului
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/payment/health').then((res) => { process.exit(res.ok ? 0 : 1); }).catch(() => process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  payment-net:
    driver: bridge
    # Pentru a atașa serviciul la o rețea Docker externă partajată (ex. un
    # reverse-proxy comun), setează `external: true` și numele rețelei:
    #   external: true
    #   name: nova-net
