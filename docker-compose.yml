services:
  payment-api:
    build:
      context: .
      dockerfile: Dockerfile

    image: laradu-payment:latest
    container_name: laradu_payment
    restart: unless-stopped

    # Secretele (chei Stripe, secrete partajate) vin din .env — NU în git.
    env_file:
      - .env

    environment:
      NODE_ENV: production
      PORT: 3000

    # Intern în rețeaua Docker. Webhook-ul Stripe este expus public de nginx-ul
    # edge la /payments/, iar shop-api îl apelează prin numele `laradu_payment`.
    expose:
      - "3000"

    networks:
      - laradu-net

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/payment/health').then((res) => { process.exit(res.ok ? 0 : 1); }).catch(() => process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  laradu-net:
    external: true
